server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.google.com" always;

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location /fonts/ {
    try_files $uri =404;
    expires 1y;
  }

  location /hero/ {
    try_files $uri =404;
    expires 1y;
  }

  location = /index.html {
    expires -1;
  }

  location = /robots.txt {
    try_files $uri =404;
    expires 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
